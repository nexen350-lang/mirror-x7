name: Build & Release APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag name (for example v3.6.0)
        type: string
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 platform and build-tools
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests, lint, and build APKs
        run: >-
          ./gradlew :app:testDebugUnitTest :libadb:testDebugUnitTest
          :app:lintDebug :app:assembleDebug :app:assembleLocalRelease
          -PabiSplits=false --no-daemon

      - name: Package release APKs and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp app/build/outputs/apk/localRelease/app-localRelease.apk release-assets/scrcpy-client-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/scrcpy-client-debug.apk
          (cd release-assets && sha256sum scrcpy-client-release.apk scrcpy-client-debug.apk > SHA256SUMS.txt)
          ls -lh release-assets

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scrcpy-client-apks
          path: release-assets/
          if-no-files-found: error

      - name: Publish GitHub Release with ready APKs
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            TITLE="Release ${TAG}"
            PRERELEASE_FLAG=""
          elif [[ -n "${INPUT_TAG}" ]]; then
            TAG="${INPUT_TAG}"
            TITLE="Release ${TAG}"
            PRERELEASE_FLAG=""
          else
            TAG="latest"
            TITLE="Latest Build (main)"
            PRERELEASE_FLAG="--prerelease"
          fi

          NOTES="Automated Android APK build from commit ${GITHUB_SHA::7}.

          - **scrcpy-client-release.apk**: Minified R8 release APK signed for direct sideload installation.
          - **scrcpy-client-debug.apk**: Debug APK for testing and diagnostics.
          - **SHA256SUMS.txt**: File integrity checksums."

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}"               release-assets/scrcpy-client-release.apk               release-assets/scrcpy-client-debug.apk               release-assets/SHA256SUMS.txt               --clobber
            gh release edit "${TAG}" --title "${TITLE}" --notes "${NOTES}"
          else
            gh release create "${TAG}"               release-assets/scrcpy-client-release.apk               release-assets/scrcpy-client-debug.apk               release-assets/SHA256SUMS.txt               --title "${TITLE}"               --notes "${NOTES}"               --target "${GITHUB_SHA}"               ${PRERELEASE_FLAG}
          fi
